name: parksense_mobile
description: Smart Parking System for ITB - ParkSense Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # MQTT for IoT Integration
  mqtt_client: ^10.2.0

  # QR Code Generation
  qr_flutter: ^4.1.0

  # Maps & Location
  geocoding: ^4.0.0

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Local Storage & Security
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5

  # JSON Serialization
  json_annotation: ^4.11.0

  # JWT Token Handling
  dart_jsonwebtoken: ^2.12.2

  # Date & Time
  intl: ^0.18.1

  # Utils
  uuid: ^4.2.2
  crypto: ^3.0.3

  # WebSocket (alternative to MQTT)
  web_socket_channel: ^2.4.0

  # Loading & UI Helpers
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # Animations
  lottie: ^2.7.0
  flutter_animate: ^4.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts (optional - Google Fonts akan digunakan)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.24
  file: ^7.0.1
  platform: ^3.1.6